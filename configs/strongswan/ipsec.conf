config setup
    charondebug="ike 1, knl 1, cfg 0"
    uniqueids=never

conn ikev2-vpn
    auto=add
    compress=no
    type=tunnel
    keyexchange=ikev2
    fragmentation=yes
    forceencaps=yes
    mobike=yes
    
    # Chiffrements compatibles IOS + Andoid + Windows
    ike=aes256-sha256-ecp256,aes256-sha256-modp2048,aes256-sha256-modp1024,aes256-sha1-modp1024!
    esp=aes256-sha256,aes256-sha1!

    # Local (Serveur)
    left=%any
    leftid=@<VOTRE_DOMAINE>
    leftcert=fullchain.pem
    leftsendcert=always
    leftsubnet=0.0.0.0/0
    
    # Remote (Clients: iOS, Android, Windows, Linux)
    right=%any
    rightid=%any
    rightauth=eap-mschapv2
    rightsourceip=10.10.10.0/24
    rightdns=1.1.1.1,8.8.8.8
    rightsendcert=never
    eap_identity=%identity